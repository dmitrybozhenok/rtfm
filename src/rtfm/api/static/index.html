<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTFM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #14161e;
  --surface2: #1a1d28;
  --surface3: #21242f;
  --border: #2a2d3a;
  --border-subtle: #1f2230;
  --text: #d4d0c8;
  --text-secondary: #8a8690;
  --text-dim: #55525e;
  --accent: #c8a46e;
  --accent-muted: rgba(200, 164, 110, 0.12);
  --accent-hover: #d9b87e;
  --accent-glow: rgba(200, 164, 110, 0.06);
  --user-bg: #1c1f2e;
  --user-border: #2a2e42;
  --success: #7ec87a;
  --error: #d47272;
  --warn: #c8a46e;
  --quote-bg: #161820;
  --quote-border: #2a2540;
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-body: 'DM Sans', -apple-system, sans-serif;
  --font-mono: 'DM Mono', 'Cascadia Code', monospace;
  --radius: 8px;
  --radius-lg: 14px;
}
[data-theme="light"] {
  --bg: #f4f1ec;
  --surface: #ffffff;
  --surface2: #f0ede6;
  --surface3: #e8e4dd;
  --border: #d8d4cc;
  --border-subtle: #e8e4dd;
  --text: #2a2520;
  --text-secondary: #6b6560;
  --text-dim: #a09890;
  --accent: #9a7540;
  --accent-muted: rgba(154, 117, 64, 0.08);
  --accent-hover: #b08848;
  --accent-glow: rgba(154, 117, 64, 0.04);
  --user-bg: #eae6de;
  --user-border: #d8d2c8;
  --success: #4a8a48;
  --error: #b84040;
  --warn: #9a7540;
  --quote-bg: #f8f5f0;
  --quote-border: #e0dcd4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ─── Header ─── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  height: 52px;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--surface);
  flex-shrink: 0;
  z-index: 20;
}
.logo {
  display: flex; align-items: baseline; gap: 6px;
  text-decoration: none; color: var(--text);
}
.logo-mark {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-style: italic;
  color: var(--accent);
  letter-spacing: -0.02em;
}
.logo-sub {
  font-size: 0.72rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
}
.header-controls { display: flex; gap: 8px; align-items: center; }
.health-indicator {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.72rem; color: var(--text-dim);
  letter-spacing: 0.03em;
}
.health-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-dim);
}
.health-dot.ok { background: var(--success); box-shadow: 0 0 6px rgba(126,200,122,0.4); }
.health-dot.degraded { background: var(--warn); }
.health-dot.bad { background: var(--error); }
.btn-header {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 0.72rem;
  font-family: var(--font-body);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 500;
  transition: all 0.2s;
}
.btn-header:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ─── Main Layout ─── */
.main-layout {
  display: flex; flex: 1; overflow: hidden;
}

/* ─── Sidebar ─── */
.sidebar {
  width: 280px; min-width: 200px; max-width: 50vw;
  background: var(--surface);
  border-right: 1px solid var(--border-subtle);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
.sidebar.collapsed { margin-left: -100%; }
.sidebar-resize {
  position: absolute; top: 0; right: -3px; bottom: 0; width: 6px;
  cursor: col-resize; z-index: 10;
}
.sidebar-resize:hover, .sidebar-resize.dragging {
  background: var(--accent); opacity: 0.3;
}
.sidebar-section-title {
  padding: 16px 18px 10px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-section-title .count {
  font-weight: 400;
  color: var(--text-dim);
  font-size: 0.66rem;
  background: var(--surface2);
  padding: 1px 7px;
  border-radius: 10px;
}

/* Upload area */
.upload-area {
  padding: 10px 14px 14px;
  border-bottom: 1px solid var(--border-subtle);
}
.upload-zone {
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  padding: 14px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--accent);
  background: var(--accent-muted);
}
.upload-zone input[type="file"] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
}
.upload-icon {
  font-size: 1.2rem;
  margin-bottom: 4px;
  color: var(--text-dim);
}
.upload-text {
  font-size: 0.76rem;
  color: var(--text-dim);
  line-height: 1.4;
}
.upload-text strong { color: var(--text-secondary); font-weight: 500; }
.upload-msg {
  font-size: 0.73rem; margin-top: 8px; text-align: center;
  min-height: 1em;
}
.upload-msg.ok { color: var(--success); }
.upload-msg.err { color: var(--error); }
.upload-msg.busy { color: var(--warn); }

/* Source list */
.source-list {
  flex: 1; overflow-y: auto; padding: 4px 8px;
}
.source-item {
  padding: 9px 12px;
  border-radius: var(--radius);
  margin-bottom: 1px;
  cursor: pointer;
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 0.82rem;
  position: relative;
  transition: background 0.15s;
}
.source-item:hover { background: var(--surface2); }
.source-item.active {
  background: var(--accent-muted);
}
.source-item.active::before {
  content: '';
  position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 2px; background: var(--accent); border-radius: 1px;
}
.source-icon {
  width: 32px; height: 32px; border-radius: 6px;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; flex-shrink: 0;
  color: var(--text-dim);
  border: 1px solid var(--border-subtle);
}
.source-item.active .source-icon {
  background: var(--accent-muted);
  border-color: rgba(200,164,110,0.2);
  color: var(--accent);
}
.source-info { flex: 1; overflow: hidden; min-width: 0; }
.source-name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 0.8rem; font-weight: 500;
}
.source-meta {
  font-size: 0.68rem; color: var(--text-dim); margin-top: 1px;
  font-variant-numeric: tabular-nums;
}
.source-actions {
  display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
}
.source-item:hover .source-actions { display: flex; }
.source-actions button {
  background: var(--surface3); border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer;
  font-size: 0.7rem; padding: 2px 6px; border-radius: 4px;
  transition: all 0.15s;
}
.source-actions button:hover { color: var(--error); border-color: var(--error); }

/* Sidebar footer */
.sidebar-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--border-subtle);
  display: flex; justify-content: space-between; align-items: center;
}
.sidebar-footer .total {
  font-size: 0.7rem; color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.btn-danger {
  font-size: 0.7rem; color: var(--error); background: none;
  border: 1px solid var(--border); border-radius: 5px;
  padding: 3px 10px; cursor: pointer;
  font-family: var(--font-body); transition: all 0.15s;
}
.btn-danger:hover { border-color: var(--error); background: rgba(212,114,114,0.08); }

/* ─── Chat Area ─── */
.chat-area {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg);
}
#chat {
  flex: 1; overflow-y: auto; padding: 24px 20px;
  display: flex; flex-direction: column; gap: 2px;
}

/* Welcome */
.welcome {
  margin: auto; text-align: center;
  max-width: 420px; padding: 60px 20px;
  animation: fadeUp 0.6s ease;
}
.welcome-icon {
  font-size: 2.4rem; margin-bottom: 16px;
  opacity: 0.3;
}
.welcome h2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.6rem;
  color: var(--text);
  margin-bottom: 10px;
  font-style: italic;
  letter-spacing: -0.01em;
}
.welcome p {
  font-size: 0.85rem;
  color: var(--text-dim);
  line-height: 1.6;
}

/* Messages */
.msg {
  max-width: 720px; width: 100%; margin: 0 auto;
  animation: fadeUp 0.3s ease;
}
.msg.user {
  display: flex; justify-content: flex-end;
  margin-bottom: 4px;
}
.msg.assistant {
  margin-bottom: 12px;
}
.bubble {
  line-height: 1.65;
  font-size: 0.88rem;
  word-wrap: break-word;
}
.msg.user .bubble {
  background: var(--user-bg);
  border: 1px solid var(--user-border);
  padding: 10px 16px;
  border-radius: 16px 16px 4px 16px;
  max-width: 75%;
  font-size: 0.86rem;
}
.msg.assistant .bubble {
  padding: 8px 2px;
  max-width: 100%;
}
.bubble pre {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  padding: 12px 14px;
  border-radius: var(--radius);
  overflow-x: auto;
  margin: 8px 0;
  font-size: 0.82rem;
  font-family: var(--font-mono);
}
.bubble code {
  font-family: var(--font-mono);
  font-size: 0.86em;
  background: var(--surface2);
  padding: 1px 5px;
  border-radius: 3px;
}
.bubble pre code { background: none; padding: 0; }
.bubble p { margin: 4px 0; }
.bubble p:first-child { margin-top: 0; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 4px 0 4px 18px; }
.bubble li { margin: 2px 0; }
.bubble strong { font-weight: 600; color: var(--text); }

/* ─── Citation Bubbles ─── */
.citations-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  overflow-x: auto;
  padding: 2px 0 6px;
  scroll-behavior: smooth;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.citations-row::-webkit-scrollbar { display: none; }

.citation-card {
  flex-shrink: 0;
  width: 220px;
  background: var(--quote-bg);
  border: 1px solid var(--quote-border);
  border-radius: var(--radius-lg);
  padding: 14px 16px 12px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.citation-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
  opacity: 0.5;
  border-radius: 0 2px 2px 0;
  transition: opacity 0.2s;
}
.citation-card:hover {
  border-color: rgba(200,164,110,0.3);
  background: var(--surface2);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.citation-card:hover::before { opacity: 1; }

.citation-quote-mark {
  font-family: var(--font-display);
  font-size: 1.8rem;
  line-height: 1;
  color: var(--accent);
  opacity: 0.35;
  margin-bottom: 2px;
  pointer-events: none;
}
.citation-snippet {
  font-size: 0.75rem;
  line-height: 1.5;
  color: var(--text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 10px;
  font-style: italic;
}
.citation-meta {
  display: flex; flex-direction: column; gap: 2px;
}
.citation-file {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.citation-section {
  font-size: 0.66rem;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.citation-score {
  position: absolute;
  top: 8px; right: 10px;
  font-size: 0.6rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  opacity: 0;
  transition: opacity 0.2s;
}
.citation-card:hover .citation-score { opacity: 1; }

/* ─── Input Area ─── */
.input-area {
  padding: 12px 20px 16px;
  background: var(--bg);
  flex-shrink: 0;
}
.input-wrap {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 6px 6px 6px 16px;
  transition: border-color 0.2s;
}
.input-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-muted);
}
#question {
  flex: 1;
  padding: 8px 0;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 0.88rem;
  font-family: var(--font-body);
  resize: none;
  min-height: 24px;
  max-height: 120px;
  line-height: 1.5;
}
#question:focus { outline: none; }
#question::placeholder { color: var(--text-dim); }
#send {
  padding: 8px 18px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: var(--bg);
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 600;
  font-family: var(--font-body);
  letter-spacing: 0.02em;
  transition: all 0.15s;
  flex-shrink: 0;
}
#send:hover { background: var(--accent-hover); }
#send:disabled { opacity: 0.35; cursor: not-allowed; }

/* ─── Source Viewer Drawer ─── */
.viewer {
  border-top: 1px solid var(--border);
  background: var(--surface);
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  flex-shrink: 0;
}
.viewer.open { max-height: 40vh; overflow-y: auto; }
.viewer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.8rem; font-weight: 500;
  position: sticky; top: 0; background: var(--surface); z-index: 5;
}
.viewer-header button {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 1.1rem;
  transition: color 0.15s;
}
.viewer-header button:hover { color: var(--text); }
.viewer-content { padding: 14px 20px; }
.viewer-chunk {
  margin-bottom: 10px;
  padding: 14px 16px;
  background: var(--surface2);
  border-radius: var(--radius);
  font-size: 0.84rem;
  line-height: 1.6;
  border: 1px solid var(--border-subtle);
}
.viewer-chunk-header {
  font-size: 0.72rem;
  color: var(--accent);
  margin-bottom: 6px;
  font-weight: 600;
  letter-spacing: 0.03em;
}
.viewer-loading {
  color: var(--text-dim); font-style: italic;
  font-size: 0.84rem; padding: 24px;
  text-align: center;
}

/* ─── Thinking Indicator ─── */
.thinking {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 0;
}
.thinking-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent);
  opacity: 0.3;
  animation: pulse 1.4s ease-in-out infinite;
}
.thinking-dot:nth-child(2) { animation-delay: 0.15s; }
.thinking-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse {
  0%, 80%, 100% { opacity: 0.15; transform: scale(0.8); }
  40% { opacity: 0.8; transform: scale(1.2); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ─── Mobile ─── */
.hamburger {
  display: none; background: none; border: none; color: var(--text);
  cursor: pointer; font-size: 1.2rem; padding: 0 4px;
}
.mobile-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 25;
  backdrop-filter: blur(2px);
}
.mobile-overlay.show { display: block; }

/* ─── Scrollbar ─── */
#chat::-webkit-scrollbar, .source-list::-webkit-scrollbar, .viewer::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-track, .source-list::-webkit-scrollbar-track, .viewer::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb, .source-list::-webkit-scrollbar-thumb, .viewer::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 2px;
}

/* ─── Drag overlay ─── */
.drag-overlay {
  display: none; position: absolute; inset: 0;
  background: var(--accent-muted);
  border: 2px dashed var(--accent);
  border-radius: var(--radius);
  z-index: 10; align-items: center; justify-content: center;
  font-size: 0.85rem; color: var(--accent);
  pointer-events: none;
  font-style: italic;
}
.sidebar.dragover .drag-overlay { display: flex; }

/* ─── Empty state ─── */
.empty-sources {
  padding: 30px 20px; text-align: center;
  color: var(--text-dim); font-size: 0.8rem;
  font-style: italic; line-height: 1.5;
}

@media (max-width: 700px) {
  .hamburger { display: block; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    z-index: 30; margin-left: -100%;
  }
  .sidebar.open { margin-left: 0; }
  .sidebar.collapsed { margin-left: -100%; }
  .msg.user .bubble { max-width: 90%; }
  .citation-card { width: 180px; }
  header { padding: 0 14px; }
  #chat { padding: 16px 14px; }
  .input-area { padding: 10px 14px 14px; }
}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
    <a class="logo" href="#">
      <span class="logo-mark">RTFM</span>
      <span class="logo-sub">for me</span>
    </a>
  </div>
  <div class="header-controls">
    <div class="health-indicator">
      <span class="health-dot" id="health" title="Checking..."></span>
    </div>
    <button class="btn-header" onclick="toggleTheme()">Theme</button>
  </div>
</header>

<div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

<div class="main-layout">
  <!-- Sources Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-resize" id="sidebarResize"></div>
    <div class="drag-overlay">Drop files here</div>

    <div class="sidebar-section-title">
      <span>Sources</span>
      <span class="count" id="sourceCount"></span>
    </div>

    <div class="upload-area">
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="ingestFile" accept=".pdf,.txt,.md" multiple onchange="doIngestFile()">
        <div class="upload-icon">&#8593;</div>
        <div class="upload-text"><strong>Upload files</strong><br>.pdf, .txt, .md</div>
      </div>
      <div class="upload-msg" id="ingestMsg"></div>
    </div>

    <div class="source-list" id="sourcesList"></div>

    <div class="sidebar-footer">
      <span class="total" id="sourcesTotal"></span>
      <button class="btn-danger" onclick="clearDocuments()">Clear all</button>
    </div>
  </aside>

  <!-- Chat + Viewer -->
  <div class="chat-area">
    <div id="chat">
      <div class="welcome">
        <div class="welcome-icon">&#9998;</div>
        <h2>What would you like to know?</h2>
        <p>Add sources in the sidebar, then ask questions. Answers are grounded in your documents with inline citations.</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="question" rows="1" placeholder="Ask a question about your docs..." autofocus></textarea>
        <button id="send" onclick="sendQuestion()">Send</button>
      </div>
    </div>

    <!-- Source Viewer Drawer -->
    <div class="viewer" id="viewer">
      <div class="viewer-header">
        <span id="viewerTitle">Source Viewer</span>
        <button onclick="closeViewer()">&times;</button>
      </div>
      <div class="viewer-content" id="viewerContent"></div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let sessionId = localStorage.getItem('rtfm_session') || crypto.randomUUID();
localStorage.setItem('rtfm_session', sessionId);
let busy = false;
let activeSource = null;

// ─── Theme ───
function toggleTheme() {
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? '' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('rtfm_theme', t);
}
(function() {
  const saved = localStorage.getItem('rtfm_theme');
  if (saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches)) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();

// ─── Mobile sidebar ───
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('mobileOverlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}

// ─── Health ───
async function checkHealth() {
  const dot = document.getElementById('health');
  try {
    const r = await fetch(API + '/health');
    const d = await r.json();
    dot.className = 'health-dot ' + (d.status === 'healthy' ? 'ok' : d.status === 'degraded' ? 'degraded' : 'bad');
    dot.title = `Redis: ${d.redis ? 'OK' : 'DOWN'} | Ollama: ${d.ollama ? 'OK' : 'DOWN'}`;
  } catch {
    dot.className = 'health-dot bad';
    dot.title = 'API unreachable';
  }
}
checkHealth();

// ─── Sources ───
async function loadSources() {
  const list = document.getElementById('sourcesList');
  const total = document.getElementById('sourcesTotal');
  const count = document.getElementById('sourceCount');
  try {
    const r = await fetch(API + '/sources');
    const sources = await r.json();
    if (sources.length === 0) {
      list.innerHTML = '<div class="empty-sources">No sources yet.<br>Upload documents to get started.</div>';
      total.textContent = '';
      count.textContent = '';
      return;
    }
    let totalChunks = 0;
    let html = '';
    for (const s of sources) {
      totalChunks += s.chunks;
      const ext = s.source.split('.').pop().toLowerCase();
      const iconMap = { pdf: '&#9827;', md: '&#9830;', txt: '&#9826;' };
      const icon = iconMap[ext] || '&#9825;';
      const name = s.source.length > 35 ? '...' + s.source.slice(-32) : s.source;
      const isActive = activeSource === s.source ? ' active' : '';
      html += `<div class="source-item${isActive}" onclick="selectSource('${escapeAttr(s.source)}')" title="${escapeHtml(s.source)}">
        <div class="source-icon">${icon}</div>
        <div class="source-info">
          <div class="source-name">${escapeHtml(name)}</div>
          <div class="source-meta">${s.chunks} chunks &middot; ${s.sections.length} sections</div>
        </div>
        <div class="source-actions">
          <button onclick="event.stopPropagation();deleteSource('${escapeAttr(s.source)}')" title="Delete">&times;</button>
        </div>
      </div>`;
    }
    list.innerHTML = html;
    total.textContent = `${totalChunks} chunks total`;
    count.textContent = sources.length;
  } catch(e) {
    list.innerHTML = '<div class="empty-sources" style="color:var(--error)">Failed to load sources</div>';
  }
}
loadSources();

// ─── Source selection & viewer ───
async function selectSource(source, section) {
  activeSource = source;
  loadSources();
  openViewer(source, section);
}

async function openViewer(source, scrollToSection) {
  const viewer = document.getElementById('viewer');
  const title = document.getElementById('viewerTitle');
  const content = document.getElementById('viewerContent');

  title.textContent = source.length > 55 ? '...' + source.slice(-52) : source;
  content.innerHTML = '<div class="viewer-loading">Loading chunks...</div>';
  viewer.classList.add('open');

  try {
    const r = await fetch(API + '/sources/' + encodeURIComponent(source) + '/chunks');
    const chunks = await r.json();
    if (chunks.error) {
      content.innerHTML = `<div class="viewer-loading">${escapeHtml(chunks.error)}</div>`;
      return;
    }
    let html = '';
    for (const c of chunks) {
      const sectionLabel = c.section ? c.section : `Chunk ${c.chunk_index}`;
      const chunkId = 'chunk-' + c.chunk_index;
      html += `<div class="viewer-chunk" id="${chunkId}" data-section="${escapeAttr(c.section || '')}">
        <div class="viewer-chunk-header">${escapeHtml(sectionLabel)}</div>
        <div>${escapeHtml(c.text).replace(/\n/g, '<br>')}</div>
      </div>`;
    }
    content.innerHTML = html || '<div class="viewer-loading">No content</div>';

    if (scrollToSection) {
      const target = content.querySelector(`[data-section="${CSS.escape(scrollToSection)}"]`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        target.style.outline = '2px solid var(--accent)';
        setTimeout(() => target.style.outline = '', 2000);
      }
    }
  } catch(e) {
    content.innerHTML = `<div class="viewer-loading" style="color:var(--error)">Error: ${escapeHtml(e.message)}</div>`;
  }
}

function closeViewer() {
  document.getElementById('viewer').classList.remove('open');
  activeSource = null;
  loadSources();
}

// ─── Source actions ───
async function deleteSource(source) {
  if (!confirm(`Delete "${source}" and all its chunks?`)) return;
  try {
    const r = await fetch(API + '/sources/' + encodeURIComponent(source), { method: 'DELETE' });
    const d = await r.json();
    if (d.status === 'ok') {
      showIngestMsg(`Deleted ${d.deleted_chunks} chunks`, 'ok');
      if (activeSource === source) closeViewer();
      loadSources();
    }
  } catch(e) {
    showIngestMsg('Error: ' + e.message, 'err');
  }
}

async function clearDocuments() {
  if (!confirm('Delete ALL ingested documents? This cannot be undone.')) return;
  try {
    const r = await fetch(API + '/documents/clear', { method: 'POST' });
    const d = await r.json();
    if (d.status === 'ok') {
      showIngestMsg(`Cleared ${d.deleted_chunks} chunks`, 'ok');
      closeViewer();
      loadSources();
    }
  } catch(e) {
    showIngestMsg('Error: ' + e.message, 'err');
  }
}

// ─── Ingest ───
function showIngestMsg(text, type) {
  const msg = document.getElementById('ingestMsg');
  msg.textContent = text;
  msg.className = 'upload-msg ' + (type || '');
  if (type === 'ok') setTimeout(() => { msg.textContent = ''; msg.className = 'upload-msg'; }, 4000);
}

async function doIngestFile() {
  const input = document.getElementById('ingestFile');
  const files = input.files;
  if (!files.length) return;

  showIngestMsg(`Uploading ${files.length} file(s)...`, 'busy');

  let totalFiles = 0, totalChunks = 0, errors = [];
  for (const file of files) {
    try {
      const body = new FormData();
      body.append('file', file);
      const r = await fetch(API + '/ingest', { method: 'POST', body });
      const d = await r.json();
      if (d.status === 'ok') {
        totalFiles += (d.files || 1);
        totalChunks += (d.chunks || 0);
      } else {
        errors.push(`${file.name}: ${d.error || 'failed'}`);
      }
    } catch(e) {
      errors.push(`${file.name}: ${e.message}`);
    }
  }

  if (errors.length) {
    showIngestMsg(`${totalFiles} files, ${totalChunks} chunks. Errors: ${errors.join('; ')}`, errors.length === files.length ? 'err' : 'ok');
  } else {
    showIngestMsg(`${totalFiles} files, ${totalChunks} chunks ingested`, 'ok');
  }
  input.value = '';
  loadSources();
}

// ─── Drag and drop ───
(function() {
  const sb = document.getElementById('sidebar');
  let dragCounter = 0;
  sb.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; sb.classList.add('dragover'); });
  sb.addEventListener('dragleave', e => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { sb.classList.remove('dragover'); dragCounter = 0; } });
  sb.addEventListener('dragover', e => e.preventDefault());
  sb.addEventListener('drop', async e => {
    e.preventDefault(); sb.classList.remove('dragover'); dragCounter = 0;
    const files = e.dataTransfer.files;
    if (!files.length) return;
    showIngestMsg(`Uploading ${files.length} dropped file(s)...`, 'busy');
    let totalFiles = 0, totalChunks = 0;
    for (const file of files) {
      try {
        const body = new FormData();
        body.append('file', file);
        const r = await fetch(API + '/ingest', { method: 'POST', body });
        const d = await r.json();
        if (d.status === 'ok') { totalFiles += (d.files || 1); totalChunks += (d.chunks || 0); }
      } catch(e) {}
    }
    showIngestMsg(`${totalFiles} files, ${totalChunks} chunks`, 'ok');
    loadSources();
  });
})();

// ─── Chat ───
function buildCitationsHtml(sources) {
  if (!sources || sources.length === 0) return '';

  let html = '<div class="citations-row">';
  for (const s of sources) {
    const file = s.file || 'unknown';
    const shortFile = file.length > 28 ? '...' + file.slice(-25) : file;
    const section = s.section || '';
    const snippet = s.snippet || '';
    const score = s.score ? (s.score * 100).toFixed(0) + '%' : '';

    html += `<div class="citation-card" onclick="selectSource('${escapeAttr(file)}','${escapeAttr(section)}')">
      <div class="citation-quote-mark">&ldquo;</div>
      <div class="citation-snippet">${escapeHtml(snippet) || '<em>No preview</em>'}</div>
      <div class="citation-meta">
        <div class="citation-file" title="${escapeHtml(file)}">${escapeHtml(shortFile)}</div>
        ${section ? `<div class="citation-section">${escapeHtml(section)}</div>` : ''}
      </div>
      ${score ? `<div class="citation-score">${score}</div>` : ''}
    </div>`;
  }
  html += '</div>';
  return html;
}

function addMessage(role, content, sources, meta) {
  const welcome = document.querySelector('.welcome');
  if (welcome) welcome.remove();

  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  let html = '<div class="bubble">';
  html += renderMarkdown(content);
  html += '</div>';

  if (sources && sources.length > 0) {
    html += buildCitationsHtml(sources);
  }

  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function getAssistantBubble(msgDiv) {
  return msgDiv.querySelector('.bubble');
}

async function sendQuestion() {
  if (busy) return;
  const input = document.getElementById('question');
  const q = input.value.trim();
  if (!q) return;

  input.value = '';
  input.style.height = 'auto';
  busy = true;
  document.getElementById('send').disabled = true;

  addMessage('user', q);

  const assistantDiv = addMessage('assistant', '');
  const bubble = getAssistantBubble(assistantDiv);
  bubble.innerHTML = '<div class="thinking"><div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div></div>';

  try {
    const body = new FormData();
    body.append('question', q);
    body.append('session_id', sessionId);
    body.append('stream', 'true');

    if (activeSource) {
      body.append('source_filter', activeSource);
    }

    const response = await fetch(API + '/chat', { method: 'POST', body });

    if (!response.ok) {
      const err = await response.text();
      bubble.innerHTML = `<span style="color:var(--error)">Error: ${escapeHtml(err)}</span>`;
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';
    let streamSources = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data:')) {
          const raw = line.slice(5).trim();
          if (!raw || raw === '[DONE]') continue;
          try {
            const parsed = JSON.parse(raw);
            if (parsed.sources) {
              streamSources = parsed.sources;
            } else if (parsed.token) {
              fullText += parsed.token;
              bubble.innerHTML = renderMarkdown(fullText);
            }
          } catch {
            fullText += raw;
            bubble.innerHTML = renderMarkdown(fullText);
          }
        }
      }
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    if (!fullText) {
      bubble.innerHTML = '<span style="color:var(--text-dim)">No response</span>';
    }

    // Append citation cards after streaming completes
    if (streamSources.length > 0) {
      const citationsHtml = buildCitationsHtml(streamSources);
      assistantDiv.insertAdjacentHTML('beforeend', citationsHtml);
    }

  } catch(e) {
    bubble.innerHTML = `<span style="color:var(--error)">Error: ${escapeHtml(e.message)}</span>`;
  } finally {
    busy = false;
    document.getElementById('send').disabled = false;
    input.focus();
  }
}

// ─── Keyboard ───
document.getElementById('question').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
});
document.getElementById('question').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ─── Markdown ───
function renderMarkdown(text) {
  if (!text) return '';

  const codeBlocks = [];
  let s = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    codeBlocks.push(`<pre><code>${escapeHtml(code.trim())}</code></pre>`);
    return `\x00CB${codeBlocks.length - 1}\x00`;
  });

  const inlines = [];
  s = s.replace(/`([^`]+)`/g, (_, code) => {
    inlines.push(`<code>${escapeHtml(code)}</code>`);
    return `\x00IC${inlines.length - 1}\x00`;
  });

  s = escapeHtml(s);

  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');

  s = s.replace(/\n\n+/g, '</p><p>');
  s = s.replace(/\n/g, '<br>');
  s = '<p>' + s + '</p>';

  s = s.replace(/\x00CB(\d+)\x00/g, (_, i) => codeBlocks[i]);
  s = s.replace(/\x00IC(\d+)\x00/g, (_, i) => inlines[i]);

  return s;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

// ─── Sidebar resize ───
(function() {
  const handle = document.getElementById('sidebarResize');
  const sidebar = document.getElementById('sidebar');
  let dragging = false;

  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    dragging = true;
    handle.classList.add('dragging');
    sidebar.style.transition = 'none';
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const newWidth = Math.min(Math.max(e.clientX, 200), window.innerWidth * 0.5);
    sidebar.style.width = newWidth + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    sidebar.style.transition = '';
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();
</script>

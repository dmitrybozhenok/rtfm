<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTFM</title>
<style>
:root {
  --bg: #111;
  --surface: #181818;
  --surface2: #222;
  --surface3: #2a2a2a;
  --border: #303030;
  --border-subtle: #252525;
  --text: #ccc;
  --text-secondary: #999;
  --text-dim: #666;
  --accent: #7b9;
  --accent-muted: rgba(119, 187, 153, 0.1);
  --accent-hover: #8dc;
  --user-bg: #1a2030;
  --user-border: #283040;
  --success: #7b9;
  --error: #c77;
  --warn: #ca8;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --radius: 6px;
}
[data-theme="light"] {
  --bg: #f5f5f5;
  --surface: #fff;
  --surface2: #f0f0f0;
  --surface3: #e8e8e8;
  --border: #ddd;
  --border-subtle: #e8e8e8;
  --text: #222;
  --text-secondary: #666;
  --text-dim: #999;
  --accent: #2a7;
  --accent-muted: rgba(34, 170, 119, 0.08);
  --accent-hover: #1b8;
  --user-bg: #e8f0f8;
  --user-border: #d0d8e8;
  --success: #2a7;
  --error: #b44;
  --warn: #a80;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Header */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; height: 48px;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--surface); flex-shrink: 0; z-index: 20;
}
.logo { display: flex; align-items: baseline; gap: 6px; text-decoration: none; color: var(--text); }
.logo-mark { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
.logo-sub { font-size: 0.7rem; color: var(--text-dim); }
.header-controls { display: flex; gap: 8px; align-items: center; }
.health-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); display: inline-block; }
.health-dot.ok { background: var(--success); }
.health-dot.degraded { background: var(--warn); }
.health-dot.bad { background: var(--error); }
.btn-header {
  background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
  cursor: pointer; border-radius: 4px; padding: 4px 10px;
  font-size: 0.72rem; font-family: var(--font); transition: all 0.15s;
}
.btn-header:hover { border-color: var(--accent); color: var(--accent); }

/* Layout */
.main-layout { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 260px; min-width: 180px; max-width: 50vw;
  background: var(--surface); border-right: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; overflow: hidden;
  transition: margin-left 0.2s ease; position: relative;
}
.sidebar.collapsed { margin-left: -100%; }
.sidebar-resize { position: absolute; top: 0; right: -3px; bottom: 0; width: 6px; cursor: col-resize; z-index: 10; }
.sidebar-resize:hover, .sidebar-resize.dragging { background: var(--accent); opacity: 0.3; }
.sidebar-title {
  padding: 12px 14px 8px; font-size: 0.7rem; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-title .count { font-weight: 400; font-size: 0.66rem; background: var(--surface2); padding: 1px 6px; border-radius: 8px; }

/* Upload */
.upload-area { padding: 8px 12px 12px; border-bottom: 1px solid var(--border-subtle); }
.upload-zone {
  border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 12px;
  text-align: center; cursor: pointer; transition: all 0.15s; position: relative; overflow: hidden;
}
.upload-zone:hover { border-color: var(--accent); background: var(--accent-muted); }
.upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-text { font-size: 0.75rem; color: var(--text-dim); }
.upload-text strong { color: var(--text-secondary); font-weight: 500; }
.upload-msg { font-size: 0.72rem; margin-top: 6px; text-align: center; min-height: 1em; }
.upload-msg.ok { color: var(--success); }
.upload-msg.err { color: var(--error); }
.upload-msg.busy { color: var(--warn); }

/* Source list */
.source-list { flex: 1; overflow-y: auto; padding: 4px 6px; }
.source-item {
  padding: 7px 10px; border-radius: var(--radius); margin-bottom: 1px; cursor: pointer;
  display: flex; align-items: center; gap: 8px; font-size: 0.8rem; position: relative; transition: background 0.1s;
}
.source-item:hover { background: var(--surface2); }
.source-item.active { background: var(--accent-muted); }
.source-info { flex: 1; overflow: hidden; min-width: 0; }
.source-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.8rem; }
.source-meta { font-size: 0.68rem; color: var(--text-dim); }
.source-actions { display: none; position: absolute; right: 6px; }
.source-item:hover .source-actions { display: flex; }
.source-actions button {
  background: var(--surface3); border: 1px solid var(--border); color: var(--text-dim);
  cursor: pointer; font-size: 0.7rem; padding: 1px 5px; border-radius: 3px;
}
.source-actions button:hover { color: var(--error); border-color: var(--error); }
.sidebar-footer {
  padding: 8px 12px; border-top: 1px solid var(--border-subtle);
  display: flex; justify-content: space-between; align-items: center;
}
.sidebar-footer .total { font-size: 0.7rem; color: var(--text-dim); }
.btn-danger {
  font-size: 0.7rem; color: var(--error); background: none; border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 8px; cursor: pointer; font-family: var(--font);
}
.btn-danger:hover { border-color: var(--error); }

/* Chat area */
.chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#chat { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 2px; }

.welcome { margin: auto; text-align: center; max-width: 400px; padding: 40px 20px; }
.welcome h2 { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.welcome p { font-size: 0.84rem; color: var(--text-dim); line-height: 1.5; }

/* Messages */
.msg { max-width: 700px; width: 100%; margin: 0 auto; animation: fadeIn 0.2s ease; }
.msg.user { display: flex; justify-content: flex-end; margin-bottom: 4px; }
.msg.assistant { margin-bottom: 10px; }

.bubble { line-height: 1.6; font-size: 0.88rem; word-wrap: break-word; }
.msg.user .bubble {
  background: var(--user-bg); border: 1px solid var(--user-border);
  padding: 8px 14px; border-radius: 12px 12px 2px 12px; max-width: 75%;
}
.msg.assistant .bubble { padding: 6px 2px; }

/* Rendered markdown in bubbles */
.bubble h1, .bubble h2, .bubble h3, .bubble h4, .bubble h5, .bubble h6 {
  font-weight: 600; color: var(--text); margin: 0.8em 0 0.3em; line-height: 1.3;
}
.bubble h1 { font-size: 1.2rem; }
.bubble h2 { font-size: 1.1rem; }
.bubble h3 { font-size: 1rem; }
.bubble h4 { font-size: 0.92rem; }
.bubble p { margin: 4px 0; }
.bubble p:first-child { margin-top: 0; }
.bubble p:last-child { margin-bottom: 0; }
.bubble pre {
  background: var(--surface); border: 1px solid var(--border-subtle);
  padding: 10px 12px; border-radius: var(--radius); overflow-x: auto;
  margin: 6px 0; font-size: 0.82rem; font-family: var(--font-mono);
}
.bubble code { font-family: var(--font-mono); font-size: 0.86em; background: var(--surface2); padding: 1px 4px; border-radius: 3px; }
.bubble pre code { background: none; padding: 0; }
.bubble ul, .bubble ol { margin: 4px 0 4px 20px; }
.bubble li { margin: 2px 0; }
.bubble blockquote { border-left: 3px solid var(--border); padding-left: 12px; margin: 6px 0; color: var(--text-secondary); }
.bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.bubble strong { font-weight: 600; }

/* Citation links */
.citations {
  margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border-subtle);
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
}
.citations-label { font-size: 0.7rem; color: var(--text-dim); margin-right: 2px; }
.citation-link {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 3px;
  background: var(--surface2); border: 1px solid var(--border-subtle);
  color: var(--accent); font-size: 0.73rem; cursor: pointer;
  text-decoration: none; transition: all 0.1s; max-width: 260px; overflow: hidden;
}
.citation-link:hover { border-color: var(--accent); background: var(--accent-muted); }
.citation-link .cl-file { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.citation-link .cl-sep { color: var(--text-dim); flex-shrink: 0; font-size: 0.65rem; }
.citation-link .cl-section { color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Input */
.input-area { padding: 10px 16px 14px; flex-shrink: 0; }
.input-wrap {
  max-width: 700px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 4px 4px 4px 14px; transition: border-color 0.15s;
}
.input-wrap:focus-within { border-color: var(--accent); }
#question {
  flex: 1; padding: 7px 0; border: none; background: transparent;
  color: var(--text); font-size: 0.88rem; font-family: var(--font);
  resize: none; min-height: 22px; max-height: 120px; line-height: 1.5;
}
#question:focus { outline: none; }
#question::placeholder { color: var(--text-dim); }
#send {
  padding: 7px 14px; border-radius: 7px; border: none;
  background: var(--accent); color: var(--bg); cursor: pointer;
  font-size: 0.8rem; font-weight: 600; font-family: var(--font); transition: all 0.1s; flex-shrink: 0;
}
#send:hover { background: var(--accent-hover); }
#send:disabled { opacity: 0.3; cursor: not-allowed; }

/* Source viewer */
.viewer {
  border-top: 1px solid var(--border); background: var(--surface);
  max-height: 0; overflow: hidden; transition: max-height 0.25s ease; flex-shrink: 0;
}
.viewer.open { max-height: 45vh; overflow-y: auto; }
.viewer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; border-bottom: 1px solid var(--border-subtle);
  font-size: 0.8rem; font-weight: 500; position: sticky; top: 0; background: var(--surface); z-index: 5;
}
.viewer-header button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1rem; }
.viewer-header button:hover { color: var(--text); }
.viewer-body {
  padding: 16px 24px; font-size: 0.85rem; line-height: 1.7; max-width: 720px;
}
.viewer-body h1, .viewer-body h2, .viewer-body h3,
.viewer-body h4, .viewer-body h5, .viewer-body h6 {
  font-weight: 600; color: var(--text); margin: 1.2em 0 0.4em; line-height: 1.3;
}
.viewer-body h1 { font-size: 1.4rem; }
.viewer-body h2 { font-size: 1.2rem; }
.viewer-body h3 { font-size: 1.05rem; }
.viewer-body p { margin: 0.4em 0; }
.viewer-body pre {
  background: var(--surface2); border: 1px solid var(--border-subtle);
  padding: 10px 12px; border-radius: var(--radius); overflow-x: auto;
  margin: 6px 0; font-size: 0.82rem; font-family: var(--font-mono);
}
.viewer-body code { font-family: var(--font-mono); font-size: 0.86em; background: var(--surface2); padding: 1px 4px; border-radius: 3px; }
.viewer-body pre code { background: none; padding: 0; }
.viewer-body ul, .viewer-body ol { margin: 0.4em 0 0.4em 20px; }
.viewer-body li { margin: 2px 0; }
.viewer-body blockquote { border-left: 3px solid var(--border); padding-left: 12px; margin: 0.5em 0; color: var(--text-secondary); }
.viewer-body hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
.viewer-body strong { font-weight: 600; }
.viewer-body .section-anchor { scroll-margin-top: 50px; }
.viewer-loading { color: var(--text-dim); font-size: 0.84rem; padding: 20px; text-align: center; }
.viewer-body .section-highlight { background: var(--accent-muted); border-radius: 3px; transition: background 1s; }

/* Thinking */
.thinking { display: inline-flex; align-items: center; gap: 5px; padding: 4px 0; }
.thinking-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-dim); animation: pulse 1.4s ease-in-out infinite; }
.thinking-dot:nth-child(2) { animation-delay: 0.15s; }
.thinking-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Mobile */
.hamburger { display: none; background: none; border: none; color: var(--text); cursor: pointer; font-size: 1.2rem; padding: 0 4px; }
.mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 25; }
.mobile-overlay.show { display: block; }

/* Scrollbar */
#chat::-webkit-scrollbar, .source-list::-webkit-scrollbar, .viewer::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-track, .source-list::-webkit-scrollbar-track, .viewer::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb, .source-list::-webkit-scrollbar-thumb, .viewer::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Drag overlay */
.drag-overlay {
  display: none; position: absolute; inset: 0; background: var(--accent-muted);
  border: 2px dashed var(--accent); border-radius: var(--radius);
  z-index: 10; align-items: center; justify-content: center;
  font-size: 0.84rem; color: var(--accent); pointer-events: none;
}
.sidebar.dragover .drag-overlay { display: flex; }

.empty-sources { padding: 24px 16px; text-align: center; color: var(--text-dim); font-size: 0.8rem; line-height: 1.5; }

@media (max-width: 700px) {
  .hamburger { display: block; }
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 30; margin-left: -100%; }
  .sidebar.open { margin-left: 0; }
  .msg.user .bubble { max-width: 90%; }
  header { padding: 0 12px; }
  #chat { padding: 14px 12px; }
  .input-area { padding: 8px 12px 12px; }
}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
    <a class="logo" href="#"><span class="logo-mark">RTFM</span> <span class="logo-sub">for me</span></a>
  </div>
  <div class="header-controls">
    <span class="health-dot" id="health" title="Checking..."></span>
    <button class="btn-header" onclick="toggleTheme()">Theme</button>
  </div>
</header>

<div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

<div class="main-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-resize" id="sidebarResize"></div>
    <div class="drag-overlay">Drop files here</div>
    <div class="sidebar-title"><span>Sources</span><span class="count" id="sourceCount"></span></div>
    <div class="upload-area">
      <div class="upload-zone">
        <input type="file" id="ingestFile" accept=".pdf,.txt,.md" multiple onchange="doIngestFile()">
        <div class="upload-text"><strong>Upload files</strong> &mdash; .pdf .txt .md</div>
      </div>
      <div class="upload-msg" id="ingestMsg"></div>
    </div>
    <div class="source-list" id="sourcesList"></div>
    <div class="sidebar-footer">
      <span class="total" id="sourcesTotal"></span>
      <button class="btn-danger" onclick="clearDocuments()">Clear all</button>
    </div>
  </aside>

  <div class="chat-area">
    <div id="chat">
      <div class="welcome">
        <h2>Ask about your docs</h2>
        <p>Upload sources in the sidebar, then ask questions. Answers include citations linked to the original content.</p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-wrap">
        <textarea id="question" rows="1" placeholder="Ask a question..." autofocus></textarea>
        <button id="send" onclick="sendQuestion()">Send</button>
      </div>
    </div>
    <div class="viewer" id="viewer">
      <div class="viewer-header">
        <span id="viewerTitle">Source</span>
        <button onclick="closeViewer()">&times;</button>
      </div>
      <div class="viewer-body" id="viewerBody"></div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let sessionId = localStorage.getItem('rtfm_session') || crypto.randomUUID();
localStorage.setItem('rtfm_session', sessionId);
let busy = false;
let activeSource = null;

// Theme
function toggleTheme() {
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? '' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('rtfm_theme', t);
}
(function() {
  const saved = localStorage.getItem('rtfm_theme');
  if (saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches))
    document.documentElement.setAttribute('data-theme', 'light');
})();

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mobileOverlay').classList.toggle('show');
}

// Health
async function checkHealth() {
  const dot = document.getElementById('health');
  try {
    const r = await fetch(API + '/health');
    const d = await r.json();
    dot.className = 'health-dot ' + (d.status === 'healthy' ? 'ok' : d.status === 'degraded' ? 'degraded' : 'bad');
    dot.title = `Redis: ${d.redis ? 'OK' : 'DOWN'} | Ollama: ${d.ollama ? 'OK' : 'DOWN'}`;
  } catch { dot.className = 'health-dot bad'; dot.title = 'API unreachable'; }
}
checkHealth();

// Sources
async function loadSources() {
  const list = document.getElementById('sourcesList');
  const total = document.getElementById('sourcesTotal');
  const count = document.getElementById('sourceCount');
  try {
    const r = await fetch(API + '/sources');
    const sources = await r.json();
    if (!sources.length) {
      list.innerHTML = '<div class="empty-sources">No sources yet. Upload documents to get started.</div>';
      total.textContent = ''; count.textContent = ''; return;
    }
    let tc = 0, html = '';
    for (const s of sources) {
      tc += s.chunks;
      const name = s.source.length > 35 ? '...' + s.source.slice(-32) : s.source;
      const active = activeSource === s.source ? ' active' : '';
      html += `<div class="source-item${active}" onclick="selectSource('${escapeAttr(s.source)}')" title="${escapeHtml(s.source)}">
        <div class="source-info">
          <div class="source-name">${escapeHtml(name)}</div>
          <div class="source-meta">${s.chunks} chunks &middot; ${s.sections.length} sections</div>
        </div>
        <div class="source-actions">
          <button onclick="event.stopPropagation();deleteSource('${escapeAttr(s.source)}')" title="Delete">&times;</button>
        </div>
      </div>`;
    }
    list.innerHTML = html;
    total.textContent = `${tc} chunks`;
    count.textContent = sources.length;
  } catch(e) {
    list.innerHTML = '<div class="empty-sources" style="color:var(--error)">Failed to load sources</div>';
  }
}
loadSources();

// Source viewer
async function selectSource(source, section) {
  activeSource = source;
  loadSources();
  openViewer(source, section);
}

async function openViewer(source, scrollToSection) {
  const viewer = document.getElementById('viewer');
  const title = document.getElementById('viewerTitle');
  const body = document.getElementById('viewerBody');

  title.textContent = source.length > 55 ? '...' + source.slice(-52) : source;
  body.innerHTML = '<div class="viewer-loading">Loading...</div>';
  viewer.classList.add('open');

  try {
    const r = await fetch(API + '/sources/' + encodeURIComponent(source) + '/chunks');
    const chunks = await r.json();
    if (chunks.error) { body.innerHTML = `<div class="viewer-loading">${escapeHtml(chunks.error)}</div>`; return; }

    // Render each chunk's markdown, wrapping in a div with section data for scroll targeting
    let html = '';
    for (const c of chunks) {
      const id = 'section-' + c.chunk_index;
      const sectionAttr = c.section ? ` data-section="${escapeAttr(c.section)}"` : '';
      html += `<div id="${id}" class="section-anchor"${sectionAttr}>${renderMarkdown(c.text)}</div>`;
    }
    body.innerHTML = html || '<div class="viewer-loading">No content</div>';

    // Scroll to section
    if (scrollToSection) {
      const target = body.querySelector(`[data-section="${CSS.escape(scrollToSection)}"]`);
      if (target) {
        setTimeout(() => {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          target.classList.add('section-highlight');
          setTimeout(() => target.classList.remove('section-highlight'), 2000);
        }, 100);
      }
    }
  } catch(e) {
    body.innerHTML = `<div class="viewer-loading" style="color:var(--error)">Error: ${escapeHtml(e.message)}</div>`;
  }
}

function closeViewer() {
  document.getElementById('viewer').classList.remove('open');
  activeSource = null;
  loadSources();
}

// Source actions
async function deleteSource(source) {
  if (!confirm(`Delete "${source}" and all its chunks?`)) return;
  try {
    const r = await fetch(API + '/sources/' + encodeURIComponent(source), { method: 'DELETE' });
    const d = await r.json();
    if (d.status === 'ok') { showMsg(`Deleted ${d.deleted_chunks} chunks`, 'ok'); if (activeSource === source) closeViewer(); loadSources(); }
  } catch(e) { showMsg('Error: ' + e.message, 'err'); }
}

async function clearDocuments() {
  if (!confirm('Delete ALL documents?')) return;
  try {
    const r = await fetch(API + '/documents/clear', { method: 'POST' });
    const d = await r.json();
    if (d.status === 'ok') { showMsg(`Cleared ${d.deleted_chunks} chunks`, 'ok'); closeViewer(); loadSources(); }
  } catch(e) { showMsg('Error: ' + e.message, 'err'); }
}

// Ingest
function showMsg(text, type) {
  const msg = document.getElementById('ingestMsg');
  msg.textContent = text; msg.className = 'upload-msg ' + (type || '');
  if (type === 'ok') setTimeout(() => { msg.textContent = ''; msg.className = 'upload-msg'; }, 4000);
}

async function doIngestFile() {
  const input = document.getElementById('ingestFile');
  if (!input.files.length) return;
  showMsg(`Uploading ${input.files.length} file(s)...`, 'busy');
  let tf = 0, tc = 0, errors = [];
  for (const file of input.files) {
    try {
      const body = new FormData(); body.append('file', file);
      const r = await fetch(API + '/ingest', { method: 'POST', body });
      const d = await r.json();
      if (d.status === 'ok') { tf += (d.files || 1); tc += (d.chunks || 0); }
      else errors.push(`${file.name}: ${d.error || 'failed'}`);
    } catch(e) { errors.push(`${file.name}: ${e.message}`); }
  }
  showMsg(errors.length ? `${tf} files, ${tc} chunks. Errors: ${errors.join('; ')}` : `${tf} files, ${tc} chunks`, errors.length === input.files.length ? 'err' : 'ok');
  input.value = ''; loadSources();
}

// Drag and drop
(function() {
  const sb = document.getElementById('sidebar'); let dc = 0;
  sb.addEventListener('dragenter', e => { e.preventDefault(); dc++; sb.classList.add('dragover'); });
  sb.addEventListener('dragleave', e => { e.preventDefault(); dc--; if (dc <= 0) { sb.classList.remove('dragover'); dc = 0; } });
  sb.addEventListener('dragover', e => e.preventDefault());
  sb.addEventListener('drop', async e => {
    e.preventDefault(); sb.classList.remove('dragover'); dc = 0;
    const files = e.dataTransfer.files; if (!files.length) return;
    showMsg(`Uploading ${files.length} file(s)...`, 'busy');
    let tf = 0, tc = 0;
    for (const file of files) {
      try { const body = new FormData(); body.append('file', file); const r = await fetch(API + '/ingest', { method: 'POST', body }); const d = await r.json(); if (d.status === 'ok') { tf += (d.files||1); tc += (d.chunks||0); } } catch(e) {}
    }
    showMsg(`${tf} files, ${tc} chunks`, 'ok'); loadSources();
  });
})();

// Chat
function buildCitationsHtml(sources) {
  if (!sources || !sources.length) return '';
  const seen = new Set(), unique = [];
  for (const s of sources) { const k = (s.file||'')+'::'+( s.section||''); if (!seen.has(k)) { seen.add(k); unique.push(s); } }
  let html = '<div class="citations"><span class="citations-label">Sources:</span>';
  for (const s of unique) {
    const file = s.file || 'unknown';
    const short = file.split('/').pop().split('\\').pop();
    const sec = s.section || '';
    const label = sec
      ? `<span class="cl-file">${escapeHtml(short)}</span><span class="cl-sep">&rsaquo;</span><span class="cl-section">${escapeHtml(sec)}</span>`
      : `<span class="cl-file">${escapeHtml(short)}</span>`;
    html += `<a class="citation-link" href="#" onclick="event.preventDefault();selectSource('${escapeAttr(file)}','${escapeAttr(sec)}')" title="${escapeHtml(file)}${sec ? ' — '+escapeHtml(sec) : ''}">${label}</a>`;
  }
  return html + '</div>';
}

function addMessage(role, content, sources) {
  const welcome = document.querySelector('.welcome'); if (welcome) welcome.remove();
  const chat = document.getElementById('chat');
  const div = document.createElement('div'); div.className = 'msg ' + role;
  let html = '<div class="bubble">' + renderMarkdown(content) + '</div>';
  if (sources && sources.length) html += buildCitationsHtml(sources);
  div.innerHTML = html;
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendQuestion() {
  if (busy) return;
  const input = document.getElementById('question');
  const q = input.value.trim(); if (!q) return;
  input.value = ''; input.style.height = 'auto';
  busy = true; document.getElementById('send').disabled = true;
  addMessage('user', q);
  const aDiv = addMessage('assistant', '');
  const bubble = aDiv.querySelector('.bubble');
  bubble.innerHTML = '<div class="thinking"><div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div></div>';
  try {
    const body = new FormData();
    body.append('question', q); body.append('session_id', sessionId); body.append('stream', 'true');
    if (activeSource) body.append('source_filter', activeSource);
    const response = await fetch(API + '/chat', { method: 'POST', body });
    if (!response.ok) { bubble.innerHTML = `<span style="color:var(--error)">Error: ${escapeHtml(await response.text())}</span>`; return; }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '', buffer = '', streamSources = [];
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n'); buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const raw = line.slice(5).trim(); if (!raw || raw === '[DONE]') continue;
        try {
          const p = JSON.parse(raw);
          if (p.sources) streamSources = p.sources;
          else if (p.token) { fullText += p.token; bubble.innerHTML = renderMarkdown(fullText); }
        } catch { fullText += raw; bubble.innerHTML = renderMarkdown(fullText); }
      }
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }
    if (!fullText) bubble.innerHTML = '<span style="color:var(--text-dim)">No response</span>';
    if (streamSources.length) aDiv.insertAdjacentHTML('beforeend', buildCitationsHtml(streamSources));
  } catch(e) { bubble.innerHTML = `<span style="color:var(--error)">Error: ${escapeHtml(e.message)}</span>`; }
  finally { busy = false; document.getElementById('send').disabled = false; input.focus(); }
}

// Keyboard
document.getElementById('question').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
});
document.getElementById('question').addEventListener('input', function() {
  this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Markdown renderer
function renderMarkdown(text) {
  if (!text) return '';

  // Extract fenced code blocks
  const codeBlocks = [];
  let s = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    codeBlocks.push(`<pre><code>${escapeHtml(code.trim())}</code></pre>`);
    return '\x00CB' + (codeBlocks.length - 1) + '\x00';
  });

  // Extract inline code
  const inlineCodes = [];
  s = s.replace(/`([^`]+)`/g, (_, code) => {
    inlineCodes.push(`<code>${escapeHtml(code)}</code>`);
    return '\x00IC' + (inlineCodes.length - 1) + '\x00';
  });

  const lines = s.split('\n');
  let html = '', inList = false, listTag = '', inBQ = false, para = [];

  function flushPara() { if (para.length) { html += '<p>' + fmt(para.join('<br>')) + '</p>'; para = []; } }
  function closeList() { if (inList) { html += '</' + listTag + '>'; inList = false; } }
  function closeBQ() { if (inBQ) { html += '</blockquote>'; inBQ = false; } }

  for (const line of lines) {
    const t = line.trim();

    if (t === '') { flushPara(); closeList(); closeBQ(); continue; }

    // Code block placeholder
    if (/^\x00CB\d+\x00$/.test(t)) { flushPara(); closeList(); closeBQ(); html += t; continue; }

    // Heading
    const hm = t.match(/^(#{1,6})\s+(.+)$/);
    if (hm) { flushPara(); closeList(); closeBQ(); html += `<h${hm[1].length}>${fmt(escapeHtml(hm[2]))}</h${hm[1].length}>`; continue; }

    // HR
    if (/^[-*_]{3,}\s*$/.test(t)) { flushPara(); closeList(); closeBQ(); html += '<hr>'; continue; }

    // Unordered list
    const ul = t.match(/^[-*+]\s+(.+)$/);
    if (ul) { flushPara(); closeBQ(); if (!inList || listTag !== 'ul') { closeList(); html += '<ul>'; inList = true; listTag = 'ul'; } html += '<li>' + fmt(escapeHtml(ul[1])) + '</li>'; continue; }

    // Ordered list
    const ol = t.match(/^\d+[.)]\s+(.+)$/);
    if (ol) { flushPara(); closeBQ(); if (!inList || listTag !== 'ol') { closeList(); html += '<ol>'; inList = true; listTag = 'ol'; } html += '<li>' + fmt(escapeHtml(ol[1])) + '</li>'; continue; }

    // Blockquote
    const bq = t.match(/^>\s?(.*)$/);
    if (bq) { flushPara(); closeList(); if (!inBQ) { html += '<blockquote>'; inBQ = true; } html += fmt(escapeHtml(bq[1])) + '<br>'; continue; }

    // Paragraph text
    closeList(); closeBQ();
    para.push(escapeHtml(t));
  }
  flushPara(); closeList(); closeBQ();

  // Restore placeholders
  html = html.replace(/\x00CB(\d+)\x00/g, (_, i) => codeBlocks[i]);
  html = html.replace(/\x00IC(\d+)\x00/g, (_, i) => inlineCodes[i]);
  return html;
}

function fmt(s) {
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/_(.+?)_/g, '<em>$1</em>');
  return s;
}

function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function escapeAttr(str) { return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

// Sidebar resize
(function() {
  const handle = document.getElementById('sidebarResize');
  const sidebar = document.getElementById('sidebar');
  let dragging = false;
  handle.addEventListener('mousedown', e => { e.preventDefault(); dragging = true; handle.classList.add('dragging'); sidebar.style.transition = 'none'; document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; });
  document.addEventListener('mousemove', e => { if (!dragging) return; sidebar.style.width = Math.min(Math.max(e.clientX, 180), window.innerWidth * 0.5) + 'px'; });
  document.addEventListener('mouseup', () => { if (!dragging) return; dragging = false; handle.classList.remove('dragging'); sidebar.style.transition = ''; document.body.style.cursor = ''; document.body.style.userSelect = ''; });
})();

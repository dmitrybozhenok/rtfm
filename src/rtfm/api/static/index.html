<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTFM</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1b26;
  --surface2: #24253a;
  --border: #2f3146;
  --text: #c0caf5;
  --text-dim: #565f89;
  --accent: #7aa2f7;
  --accent-hover: #89b4fa;
  --user-bg: #283457;
  --success: #9ece6a;
  --error: #f7768e;
  --warn: #e0af68;
}
[data-theme="light"] {
  --bg: #f0f0f5;
  --surface: #ffffff;
  --surface2: #e8e8f0;
  --border: #d0d0dd;
  --text: #1a1b2e;
  --text-dim: #6b6b80;
  --accent: #4060d0;
  --accent-hover: #5070e0;
  --user-bg: #dde4f8;
  --success: #40a040;
  --error: #d03030;
  --warn: #c08020;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column;
}

/* Header */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: var(--surface);
}
header h1 { font-size: 1.2rem; font-weight: 700; }
header h1 span { color: var(--accent); }
.header-controls { display: flex; gap: 8px; align-items: center; }
.health-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-dim); display: inline-block;
}
.health-dot.ok { background: var(--success); }
.health-dot.degraded { background: var(--warn); }
.health-dot.bad { background: var(--error); }
.btn-sm {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; border-radius: 6px;
  padding: 4px 10px; font-size: 0.8rem;
}
.btn-sm:hover { border-color: var(--accent); }
.btn-sm.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.btn-danger { color: var(--error); }
.btn-danger:hover { border-color: var(--error); }

/* Panel (shared for ingest + sources) */
.panel {
  display: none; padding: 12px 20px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.panel.show { display: block; }
.panel-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }

/* Ingest panel */
.ingest-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.ingest-row:last-child { margin-bottom: 0; }
.ingest-row input[type="text"] {
  flex: 1; padding: 6px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); font-size: 0.85rem;
}
.ingest-row input[type="text"]:focus { outline: none; border-color: var(--accent); }
.ingest-row input[type="file"] { font-size: 0.8rem; color: var(--text-dim); }
.btn-ingest {
  padding: 6px 14px; border-radius: 6px; border: none;
  background: var(--accent); color: #fff; cursor: pointer;
  font-size: 0.85rem; white-space: nowrap;
}
.btn-ingest:disabled { opacity: 0.5; cursor: not-allowed; }
.ingest-row label { font-size: 0.8rem; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
.ingest-msg { font-size: 0.8rem; margin-top: 4px; }
.ingest-msg.ok { color: var(--success); }
.ingest-msg.err { color: var(--error); }
.ingest-msg.busy { color: var(--warn); }

/* Sources panel */
.sources-list { font-size: 0.82rem; }
.source-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; border-radius: 6px; margin-bottom: 4px;
  background: var(--surface2);
}
.source-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source-badge {
  font-size: 0.7rem; padding: 1px 6px; border-radius: 4px;
  background: var(--border); color: var(--text-dim); margin-left: 8px;
  white-space: nowrap;
}
.source-badge.web { background: #1a3a5c; color: var(--accent); }
.source-badge.file { background: #2a3a2a; color: var(--success); }
.sources-empty { color: var(--text-dim); font-style: italic; }
.sources-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
  font-size: 0.8rem;
}
.sources-total { color: var(--text-dim); }

/* Chat area */
#chat {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.msg { max-width: 780px; width: 100%; margin: 0 auto; display: flex; gap: 12px; }
.msg.user { justify-content: flex-end; }
.bubble {
  padding: 12px 16px; border-radius: 12px;
  line-height: 1.55; font-size: 0.92rem;
  max-width: 85%; word-wrap: break-word;
}
.msg.user .bubble { background: var(--user-bg); border-bottom-right-radius: 4px; }
.msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.bubble pre {
  background: var(--bg); padding: 10px 12px; border-radius: 6px;
  overflow-x: auto; margin: 8px 0; font-size: 0.85rem;
}
.bubble code { font-family: "Cascadia Code", "Fira Code", monospace; font-size: 0.88em; }
.bubble p { margin: 6px 0; }
.bubble p:first-child { margin-top: 0; }
.bubble p:last-child { margin-bottom: 0; }

/* Chat sources */
.chat-sources {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border); font-size: 0.78rem;
}
.chat-sources summary { cursor: pointer; color: var(--text-dim); }
.chat-sources ul { margin: 4px 0 0 16px; color: var(--text-dim); }
.chat-sources li { margin: 2px 0; }
.meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }

/* Input area */
.input-area {
  padding: 12px 20px; border-top: 1px solid var(--border);
  background: var(--surface);
}
.input-wrap {
  max-width: 780px; margin: 0 auto; display: flex; gap: 8px;
}
#question {
  flex: 1; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); font-size: 0.92rem; font-family: inherit;
  resize: none; min-height: 44px; max-height: 120px;
}
#question:focus { outline: none; border-color: var(--accent); }
#send {
  padding: 10px 18px; border-radius: 10px; border: none;
  background: var(--accent); color: #fff; cursor: pointer;
  font-size: 0.92rem; font-weight: 600; align-self: flex-end;
}
#send:hover { background: var(--accent-hover); }
#send:disabled { opacity: 0.5; cursor: not-allowed; }

/* Welcome */
.welcome {
  text-align: center; color: var(--text-dim); margin: auto;
  max-width: 500px; padding: 40px 20px;
}
.welcome h2 { color: var(--text); margin-bottom: 8px; font-size: 1.3rem; }
.welcome p { font-size: 0.9rem; line-height: 1.5; }

/* Scrollbar */
#chat::-webkit-scrollbar { width: 6px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 600px) {
  .bubble { max-width: 95%; }
  header h1 { font-size: 1rem; }
  .ingest-row { flex-wrap: wrap; }
}
</style>
</head>
<body>

<header>
  <h1><span>RTFM</span> for me</h1>
  <div class="header-controls">
    <span class="health-dot" id="health" title="Checking..."></span>
    <button class="btn-sm" onclick="togglePanel('sources')">Sources</button>
    <button class="btn-sm" onclick="togglePanel('ingest')">Ingest</button>
    <button class="btn-sm" onclick="toggleTheme()">Theme</button>
  </div>
</header>

<!-- Ingest Panel -->
<div class="panel" id="ingestPanel">
  <div class="panel-title">Ingest Documents</div>
  <div class="ingest-row">
    <input type="text" id="ingestUrl" placeholder="Paste a URL to ingest...">
    <label><input type="checkbox" id="ingestRecursive"> Recursive</label>
    <button class="btn-ingest" onclick="doIngestUrl()" id="btnIngestUrl">Ingest URL</button>
  </div>
  <div class="ingest-row">
    <input type="file" id="ingestFile" accept=".pdf,.txt,.md" multiple>
    <button class="btn-ingest" onclick="doIngestFile()" id="btnIngestFile">Upload</button>
  </div>
  <div class="ingest-msg" id="ingestMsg"></div>
</div>

<!-- Sources Panel -->
<div class="panel" id="sourcesPanel">
  <div class="panel-title">Ingested Sources</div>
  <div class="sources-list" id="sourcesList">
    <div class="sources-empty">Loading...</div>
  </div>
  <div class="sources-footer">
    <span class="sources-total" id="sourcesTotal"></span>
    <button class="btn-sm btn-danger" onclick="clearDocuments()">Clear All Documents</button>
  </div>
</div>

<div id="chat">
  <div class="welcome">
    <h2>Ask me anything about your docs</h2>
    <p>Ingest documentation first, then ask questions. Answers are grounded in your ingested sources with citations.</p>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="question" rows="1" placeholder="Ask a question..." autofocus></textarea>
    <button id="send" onclick="sendQuestion()">Send</button>
  </div>
</div>

<script>
const API = window.location.origin;
let sessionId = localStorage.getItem('rtfm_session') || crypto.randomUUID();
localStorage.setItem('rtfm_session', sessionId);
let busy = false;

// Theme
function toggleTheme() {
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? '' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('rtfm_theme', t);
}
(function() {
  const saved = localStorage.getItem('rtfm_theme');
  if (saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches)) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();

// Panels
function togglePanel(name) {
  const panels = ['ingest', 'sources'];
  for (const p of panels) {
    const el = document.getElementById(p + 'Panel');
    if (p === name) {
      const showing = el.classList.toggle('show');
      if (showing && p === 'sources') loadSources();
    } else {
      el.classList.remove('show');
    }
  }
}

// Health check
async function checkHealth() {
  const dot = document.getElementById('health');
  try {
    const r = await fetch(API + '/health');
    const d = await r.json();
    dot.className = 'health-dot ' + (d.status === 'healthy' ? 'ok' : d.status === 'degraded' ? 'degraded' : 'bad');
    dot.title = `Redis: ${d.redis ? 'OK' : 'DOWN'} | Ollama: ${d.ollama ? 'OK' : 'DOWN'}`;
  } catch {
    dot.className = 'health-dot bad';
    dot.title = 'API unreachable';
  }
}
checkHealth();

// Sources
async function loadSources() {
  const list = document.getElementById('sourcesList');
  const total = document.getElementById('sourcesTotal');
  try {
    const r = await fetch(API + '/sources');
    const sources = await r.json();
    if (sources.length === 0) {
      list.innerHTML = '<div class="sources-empty">No documents ingested yet</div>';
      total.textContent = '';
      return;
    }
    let totalChunks = 0;
    let html = '';
    for (const s of sources) {
      totalChunks += s.chunks;
      const typeClass = s.type === 'web' ? 'web' : 'file';
      html += `<div class="source-item">
        <span class="source-name" title="${escapeHtml(s.source)}">${escapeHtml(s.source)}</span>
        <span class="source-badge ${typeClass}">${s.type}</span>
        <span class="source-badge">${s.chunks} chunks</span>
      </div>`;
    }
    list.innerHTML = html;
    total.textContent = `${sources.length} sources, ${totalChunks} total chunks`;
  } catch(e) {
    list.innerHTML = `<div class="sources-empty" style="color:var(--error)">Failed to load sources</div>`;
  }
}

async function clearDocuments() {
  if (!confirm('Delete all ingested documents? This cannot be undone.')) return;
  try {
    const r = await fetch(API + '/documents/clear', { method: 'POST' });
    const d = await r.json();
    if (d.status === 'ok') {
      loadSources();
      showIngestMsg(`Cleared ${d.deleted_chunks} chunks`, 'ok');
    }
  } catch(e) {
    showIngestMsg('Error: ' + e.message, 'err');
  }
}

// Ingest
function showIngestMsg(text, type) {
  const msg = document.getElementById('ingestMsg');
  msg.textContent = text;
  msg.className = 'ingest-msg ' + (type || '');
}

async function doIngestUrl() {
  const url = document.getElementById('ingestUrl').value.trim();
  if (!url) return;
  const btn = document.getElementById('btnIngestUrl');
  btn.disabled = true;
  showIngestMsg('Ingesting URL...', 'busy');
  try {
    const body = new FormData();
    body.append('url', url);
    body.append('recursive', document.getElementById('ingestRecursive').checked);
    const r = await fetch(API + '/ingest/url', { method: 'POST', body });
    const d = await r.json();
    if (d.status === 'ok') {
      showIngestMsg(`Done! ${d.pages || d.files || 0} pages, ${d.chunks} chunks ingested`, 'ok');
      document.getElementById('ingestUrl').value = '';
      loadSources();
    } else {
      showIngestMsg(d.error || 'Failed', 'err');
    }
  } catch(e) {
    showIngestMsg('Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

async function doIngestFile() {
  const input = document.getElementById('ingestFile');
  const files = input.files;
  if (!files.length) return;
  const btn = document.getElementById('btnIngestFile');
  btn.disabled = true;
  showIngestMsg(`Uploading ${files.length} file(s)...`, 'busy');

  let totalFiles = 0, totalChunks = 0, errors = [];
  for (const file of files) {
    try {
      const body = new FormData();
      body.append('file', file);
      const r = await fetch(API + '/ingest', { method: 'POST', body });
      const d = await r.json();
      if (d.status === 'ok') {
        totalFiles += (d.files || 1);
        totalChunks += (d.chunks || 0);
      } else {
        errors.push(`${file.name}: ${d.error || 'failed'}`);
      }
    } catch(e) {
      errors.push(`${file.name}: ${e.message}`);
    }
  }

  if (errors.length) {
    showIngestMsg(`${totalFiles} files, ${totalChunks} chunks. Errors: ${errors.join('; ')}`, errors.length === files.length ? 'err' : 'ok');
  } else {
    showIngestMsg(`Done! ${totalFiles} files, ${totalChunks} chunks ingested`, 'ok');
  }
  input.value = '';
  btn.disabled = false;
  loadSources();
}

// Chat
function addMessage(role, content, sources, meta) {
  const welcome = document.querySelector('.welcome');
  if (welcome) welcome.remove();

  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  let html = '<div class="bubble">';
  html += renderMarkdown(content);

  if (sources && sources.length > 0) {
    html += '<div class="chat-sources"><details><summary>Sources (' + sources.length + ')</summary><ul>';
    for (const s of sources) {
      const label = s.url || s.file || 'unknown';
      const section = s.section ? ` \u2014 ${s.section}` : '';
      if (s.url) {
        html += `<li><a href="${escapeHtml(s.url)}" target="_blank" style="color:var(--accent)">${escapeHtml(label)}</a>${escapeHtml(section)}</li>`;
      } else {
        html += `<li>${escapeHtml(label)}${escapeHtml(section)}</li>`;
      }
    }
    html += '</ul></details></div>';
  }
  if (meta) {
    html += `<div class="meta">${escapeHtml(meta)}</div>`;
  }
  html += '</div>';
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function getAssistantBubble(msgDiv) {
  return msgDiv.querySelector('.bubble');
}

async function sendQuestion() {
  if (busy) return;
  const input = document.getElementById('question');
  const q = input.value.trim();
  if (!q) return;

  input.value = '';
  input.style.height = 'auto';
  busy = true;
  document.getElementById('send').disabled = true;

  addMessage('user', q);

  const assistantDiv = addMessage('assistant', '');
  const bubble = getAssistantBubble(assistantDiv);

  try {
    const body = new FormData();
    body.append('question', q);
    body.append('session_id', sessionId);
    body.append('stream', 'true');

    const response = await fetch(API + '/chat', { method: 'POST', body });

    if (!response.ok) {
      const err = await response.text();
      bubble.innerHTML = `<span style="color:var(--error)">Error: ${escapeHtml(err)}</span>`;
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data:')) {
          const raw = line.slice(5).trim();
          if (!raw || raw === '[DONE]') continue;
          try {
            const parsed = JSON.parse(raw);
            fullText += parsed.token;
          } catch {
            fullText += raw;
          }
          bubble.innerHTML = renderMarkdown(fullText);
        }
      }
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    if (!fullText) {
      bubble.innerHTML = '<span style="color:var(--text-dim)">No response</span>';
    }

  } catch(e) {
    bubble.innerHTML = `<span style="color:var(--error)">Error: ${escapeHtml(e.message)}</span>`;
  } finally {
    busy = false;
    document.getElementById('send').disabled = false;
    input.focus();
  }
}

// Enter to send, Shift+Enter for newline
document.getElementById('question').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
});

// Auto-resize textarea
document.getElementById('question').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Simple markdown rendering
function renderMarkdown(text) {
  if (!text) return '';

  // Extract code blocks first to protect them
  const codeBlocks = [];
  let s = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    codeBlocks.push(`<pre><code>${escapeHtml(code.trim())}</code></pre>`);
    return `\x00CB${codeBlocks.length - 1}\x00`;
  });

  // Extract inline code
  const inlines = [];
  s = s.replace(/`([^`]+)`/g, (_, code) => {
    inlines.push(`<code>${escapeHtml(code)}</code>`);
    return `\x00IC${inlines.length - 1}\x00`;
  });

  // Escape the rest
  s = escapeHtml(s);

  // Bold and italic
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Line breaks
  s = s.replace(/\n\n+/g, '</p><p>');
  s = s.replace(/\n/g, '<br>');
  s = '<p>' + s + '</p>';

  // Restore protected blocks
  s = s.replace(/\x00CB(\d+)\x00/g, (_, i) => codeBlocks[i]);
  s = s.replace(/\x00IC(\d+)\x00/g, (_, i) => inlines[i]);

  return s;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTFM</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1b26;
  --surface2: #24253a;
  --border: #2f3146;
  --text: #c0caf5;
  --text-dim: #565f89;
  --accent: #7aa2f7;
  --accent-hover: #89b4fa;
  --user-bg: #283457;
  --success: #9ece6a;
  --error: #f7768e;
  --warn: #e0af68;
}
[data-theme="light"] {
  --bg: #f0f0f5;
  --surface: #ffffff;
  --surface2: #e8e8f0;
  --border: #d0d0dd;
  --text: #1a1b2e;
  --text-dim: #6b6b80;
  --accent: #4060d0;
  --accent-hover: #5070e0;
  --user-bg: #dde4f8;
  --success: #40a040;
  --error: #d03030;
  --warn: #c08020;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column;
  overflow: hidden;
}

/* Header */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0; z-index: 20;
}
header h1 { font-size: 1.1rem; font-weight: 700; }
header h1 span { color: var(--accent); }
.header-controls { display: flex; gap: 6px; align-items: center; }
.health-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-dim); display: inline-block;
}
.health-dot.ok { background: var(--success); }
.health-dot.degraded { background: var(--warn); }
.health-dot.bad { background: var(--error); }
.btn-sm {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; border-radius: 6px;
  padding: 4px 10px; font-size: 0.78rem;
}
.btn-sm:hover { border-color: var(--accent); }

/* Main layout */
.main-layout {
  display: flex; flex: 1; overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 280px; min-width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: margin-left 0.2s;
}
.sidebar.collapsed { margin-left: -280px; }
.sidebar-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  font-size: 0.82rem; font-weight: 600;
}
.sidebar-header .count { color: var(--text-dim); font-weight: 400; }

/* Add source area */
.add-source {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
}
.add-row { display: flex; gap: 6px; margin-bottom: 6px; }
.add-row:last-child { margin-bottom: 0; }
.add-row input[type="text"] {
  flex: 1; padding: 5px 8px; border-radius: 5px;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); font-size: 0.8rem;
}
.add-row input[type="text"]:focus { outline: none; border-color: var(--accent); }
.add-row input[type="file"] { font-size: 0.75rem; color: var(--text-dim); max-width: 140px; }
.btn-add {
  padding: 5px 10px; border-radius: 5px; border: none;
  background: var(--accent); color: #fff; cursor: pointer;
  font-size: 0.78rem; white-space: nowrap;
}
.btn-add:disabled { opacity: 0.5; cursor: not-allowed; }
.add-row label { font-size: 0.75rem; color: var(--text-dim); display: flex; align-items: center; gap: 3px; }
.add-msg { font-size: 0.75rem; margin-top: 4px; }
.add-msg.ok { color: var(--success); }
.add-msg.err { color: var(--error); }
.add-msg.busy { color: var(--warn); }

/* Source list */
.source-list {
  flex: 1; overflow-y: auto; padding: 6px;
}
.source-item {
  padding: 8px 10px; border-radius: 6px; margin-bottom: 2px;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  font-size: 0.82rem; position: relative;
}
.source-item:hover { background: var(--surface2); }
.source-item.active { background: var(--surface2); border-left: 2px solid var(--accent); }
.source-icon { font-size: 0.9rem; flex-shrink: 0; }
.source-info { flex: 1; overflow: hidden; }
.source-name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 0.82rem;
}
.source-meta { font-size: 0.7rem; color: var(--text-dim); }
.source-actions {
  display: none; gap: 2px; position: absolute; right: 6px;
}
.source-item:hover .source-actions { display: flex; }
.source-actions button {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 0.75rem; padding: 2px 4px; border-radius: 3px;
}
.source-actions button:hover { color: var(--text); background: var(--border); }

/* Sidebar footer */
.sidebar-footer {
  padding: 8px 14px; border-top: 1px solid var(--border);
  font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center;
}
.sidebar-footer .total { color: var(--text-dim); }
.btn-danger { color: var(--error); background: none; border: 1px solid var(--border); }
.btn-danger:hover { border-color: var(--error); }

/* Chat area */
.chat-area {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}
#chat {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.msg { max-width: 780px; width: 100%; margin: 0 auto; display: flex; gap: 10px; }
.msg.user { justify-content: flex-end; }
.bubble {
  padding: 10px 14px; border-radius: 12px;
  line-height: 1.55; font-size: 0.9rem;
  max-width: 85%; word-wrap: break-word;
}
.msg.user .bubble { background: var(--user-bg); border-bottom-right-radius: 4px; }
.msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.bubble pre {
  background: var(--bg); padding: 8px 10px; border-radius: 6px;
  overflow-x: auto; margin: 6px 0; font-size: 0.83rem;
}
.bubble code { font-family: "Cascadia Code", "Fira Code", monospace; font-size: 0.88em; }
.bubble p { margin: 5px 0; }
.bubble p:first-child { margin-top: 0; }
.bubble p:last-child { margin-bottom: 0; }

.chat-sources {
  margin-top: 6px; padding-top: 6px;
  border-top: 1px solid var(--border); font-size: 0.76rem;
}
.chat-sources summary { cursor: pointer; color: var(--text-dim); }
.chat-sources ul { margin: 3px 0 0 16px; color: var(--text-dim); }
.chat-sources li { margin: 2px 0; }
.meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 3px; }

/* Input area */
.input-area {
  padding: 10px 16px; border-top: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
}
.input-wrap {
  max-width: 780px; margin: 0 auto; display: flex; gap: 8px;
}
#question {
  flex: 1; padding: 9px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); font-size: 0.9rem; font-family: inherit;
  resize: none; min-height: 42px; max-height: 120px;
}
#question:focus { outline: none; border-color: var(--accent); }
#send {
  padding: 9px 16px; border-radius: 10px; border: none;
  background: var(--accent); color: #fff; cursor: pointer;
  font-size: 0.9rem; font-weight: 600; align-self: flex-end;
}
#send:hover { background: var(--accent-hover); }
#send:disabled { opacity: 0.5; cursor: not-allowed; }

/* Welcome */
.welcome {
  text-align: center; color: var(--text-dim); margin: auto;
  max-width: 480px; padding: 40px 20px;
}
.welcome h2 { color: var(--text); margin-bottom: 8px; font-size: 1.2rem; }
.welcome p { font-size: 0.88rem; line-height: 1.5; }

/* Source viewer (bottom drawer) */
.viewer {
  border-top: 1px solid var(--border);
  background: var(--surface); max-height: 0;
  overflow: hidden; transition: max-height 0.25s ease;
  flex-shrink: 0;
}
.viewer.open { max-height: 40vh; overflow-y: auto; }
.viewer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; border-bottom: 1px solid var(--border);
  font-size: 0.82rem; font-weight: 600;
  position: sticky; top: 0; background: var(--surface); z-index: 5;
}
.viewer-header button {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 1rem;
}
.viewer-content { padding: 12px 16px; }
.viewer-chunk {
  margin-bottom: 12px; padding: 10px 12px;
  background: var(--surface2); border-radius: 6px;
  font-size: 0.84rem; line-height: 1.5;
}
.viewer-chunk-header {
  font-size: 0.75rem; color: var(--accent);
  margin-bottom: 4px; font-weight: 600;
}
.viewer-loading { color: var(--text-dim); font-style: italic; font-size: 0.84rem; padding: 20px; }

/* Mobile hamburger */
.hamburger {
  display: none; background: none; border: none; color: var(--text);
  cursor: pointer; font-size: 1.3rem; padding: 0 6px;
}

/* Scrollbar */
#chat::-webkit-scrollbar, .source-list::-webkit-scrollbar, .viewer::-webkit-scrollbar { width: 5px; }
#chat::-webkit-scrollbar-track, .source-list::-webkit-scrollbar-track, .viewer::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb, .source-list::-webkit-scrollbar-thumb, .viewer::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Drag overlay */
.drag-overlay {
  display: none; position: absolute; inset: 0;
  background: rgba(122,162,247,0.1);
  border: 2px dashed var(--accent); border-radius: 8px;
  z-index: 10; align-items: center; justify-content: center;
  font-size: 0.9rem; color: var(--accent);
  pointer-events: none;
}
.sidebar.dragover .drag-overlay { display: flex; }

@media (max-width: 700px) {
  .hamburger { display: block; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    z-index: 30; margin-left: -280px;
  }
  .sidebar.open { margin-left: 0; }
  .sidebar.collapsed { margin-left: -280px; }
  .mobile-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 25;
  }
  .mobile-overlay.show { display: block; }
  .bubble { max-width: 95%; }
  header h1 { font-size: 0.95rem; }
}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
    <h1><span>RTFM</span> for me</h1>
  </div>
  <div class="header-controls">
    <span class="health-dot" id="health" title="Checking..."></span>
    <button class="btn-sm" onclick="toggleTheme()">Theme</button>
  </div>
</header>

<div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

<div class="main-layout">
  <!-- Sources Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="drag-overlay">Drop files to ingest</div>

    <div class="sidebar-header">
      <span>Sources <span class="count" id="sourceCount"></span></span>
    </div>

    <div class="add-source" id="addSource">
      <div class="add-row">
        <input type="file" id="ingestFile" accept=".pdf,.txt,.md" multiple>
        <button class="btn-add" onclick="doIngestFile()" id="btnIngestFile">Upload</button>
      </div>
      <div class="add-msg" id="ingestMsg"></div>
    </div>

    <div class="source-list" id="sourcesList"></div>

    <div class="sidebar-footer">
      <span class="total" id="sourcesTotal"></span>
      <button class="btn-sm btn-danger" onclick="clearDocuments()">Clear All</button>
    </div>
  </aside>

  <!-- Chat + Viewer -->
  <div class="chat-area">
    <div id="chat">
      <div class="welcome">
        <h2>Ask me anything about your docs</h2>
        <p>Add sources in the sidebar, then ask questions. Answers are grounded in your ingested documents with citations.</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="question" rows="1" placeholder="Ask a question..." autofocus></textarea>
        <button id="send" onclick="sendQuestion()">Send</button>
      </div>
    </div>

    <!-- Source Viewer Drawer -->
    <div class="viewer" id="viewer">
      <div class="viewer-header">
        <span id="viewerTitle">Source Viewer</span>
        <button onclick="closeViewer()">&times;</button>
      </div>
      <div class="viewer-content" id="viewerContent"></div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let sessionId = localStorage.getItem('rtfm_session') || crypto.randomUUID();
localStorage.setItem('rtfm_session', sessionId);
let busy = false;
let activeSource = null;

// Theme
function toggleTheme() {
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? '' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('rtfm_theme', t);
}
(function() {
  const saved = localStorage.getItem('rtfm_theme');
  if (saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches)) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();

// Mobile sidebar
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('mobileOverlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}

// Health
async function checkHealth() {
  const dot = document.getElementById('health');
  try {
    const r = await fetch(API + '/health');
    const d = await r.json();
    dot.className = 'health-dot ' + (d.status === 'healthy' ? 'ok' : d.status === 'degraded' ? 'degraded' : 'bad');
    dot.title = `Redis: ${d.redis ? 'OK' : 'DOWN'} | Ollama: ${d.ollama ? 'OK' : 'DOWN'}`;
  } catch {
    dot.className = 'health-dot bad';
    dot.title = 'API unreachable';
  }
}
checkHealth();

// Sources
async function loadSources() {
  const list = document.getElementById('sourcesList');
  const total = document.getElementById('sourcesTotal');
  const count = document.getElementById('sourceCount');
  try {
    const r = await fetch(API + '/sources');
    const sources = await r.json();
    if (sources.length === 0) {
      list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:0.82rem;font-style:italic;">No sources yet. Upload files above.</div>';
      total.textContent = '';
      count.textContent = '';
      return;
    }
    let totalChunks = 0;
    let html = '';
    for (const s of sources) {
      totalChunks += s.chunks;
      const icon = '&#128196;';
      const name = s.source.length > 40 ? '...' + s.source.slice(-37) : s.source;
      const isActive = activeSource === s.source ? ' active' : '';
      html += `<div class="source-item${isActive}" onclick="selectSource('${escapeAttr(s.source)}')" title="${escapeHtml(s.source)}">
        <span class="source-icon">${icon}</span>
        <div class="source-info">
          <div class="source-name">${escapeHtml(name)}</div>
          <div class="source-meta">${s.chunks} chunks &middot; ${s.sections.length} sections</div>
        </div>
        <div class="source-actions">
          <button onclick="event.stopPropagation();deleteSource('${escapeAttr(s.source)}')" title="Delete">&times;</button>
        </div>
      </div>`;
    }
    list.innerHTML = html;
    total.textContent = `${totalChunks} chunks`;
    count.textContent = `(${sources.length})`;
  } catch(e) {
    list.innerHTML = `<div style="padding:12px;color:var(--error);font-size:0.8rem;">Failed to load sources</div>`;
  }
}
loadSources();

// Source selection
async function selectSource(source) {
  activeSource = source;
  loadSources();
  openViewer(source);
}

// Source viewer
async function openViewer(source) {
  const viewer = document.getElementById('viewer');
  const title = document.getElementById('viewerTitle');
  const content = document.getElementById('viewerContent');

  title.textContent = source.length > 60 ? '...' + source.slice(-57) : source;
  content.innerHTML = '<div class="viewer-loading">Loading chunks...</div>';
  viewer.classList.add('open');

  try {
    const r = await fetch(API + '/sources/' + encodeURIComponent(source) + '/chunks');
    const chunks = await r.json();
    if (chunks.error) {
      content.innerHTML = `<div class="viewer-loading">${escapeHtml(chunks.error)}</div>`;
      return;
    }
    let html = '';
    for (const c of chunks) {
      const sectionLabel = c.section ? c.section : `Chunk ${c.chunk_index}`;
      html += `<div class="viewer-chunk">
        <div class="viewer-chunk-header">${escapeHtml(sectionLabel)}</div>
        <div>${escapeHtml(c.text).replace(/\n/g, '<br>')}</div>
      </div>`;
    }
    content.innerHTML = html || '<div class="viewer-loading">No content</div>';
  } catch(e) {
    content.innerHTML = `<div class="viewer-loading" style="color:var(--error)">Error: ${escapeHtml(e.message)}</div>`;
  }
}

function closeViewer() {
  document.getElementById('viewer').classList.remove('open');
  activeSource = null;
  loadSources();
}

// Source actions


async function deleteSource(source) {
  if (!confirm(`Delete "${source}" and all its chunks?`)) return;
  try {
    const r = await fetch(API + '/sources/' + encodeURIComponent(source), { method: 'DELETE' });
    const d = await r.json();
    if (d.status === 'ok') {
      showIngestMsg(`Deleted ${d.deleted_chunks} chunks`, 'ok');
      if (activeSource === source) closeViewer();
      loadSources();
    }
  } catch(e) {
    showIngestMsg('Error: ' + e.message, 'err');
  }
}

async function clearDocuments() {
  if (!confirm('Delete ALL ingested documents? This cannot be undone.')) return;
  try {
    const r = await fetch(API + '/documents/clear', { method: 'POST' });
    const d = await r.json();
    if (d.status === 'ok') {
      showIngestMsg(`Cleared ${d.deleted_chunks} chunks`, 'ok');
      closeViewer();
      loadSources();
    }
  } catch(e) {
    showIngestMsg('Error: ' + e.message, 'err');
  }
}

// Ingest
function showIngestMsg(text, type) {
  const msg = document.getElementById('ingestMsg');
  msg.textContent = text;
  msg.className = 'add-msg ' + (type || '');
  if (type === 'ok') setTimeout(() => { msg.textContent = ''; msg.className = 'add-msg'; }, 4000);
}

async function doIngestFile() {
  const input = document.getElementById('ingestFile');
  const files = input.files;
  if (!files.length) return;
  const btn = document.getElementById('btnIngestFile');
  btn.disabled = true;
  showIngestMsg(`Uploading ${files.length} file(s)...`, 'busy');

  let totalFiles = 0, totalChunks = 0, errors = [];
  for (const file of files) {
    try {
      const body = new FormData();
      body.append('file', file);
      const r = await fetch(API + '/ingest', { method: 'POST', body });
      const d = await r.json();
      if (d.status === 'ok') {
        totalFiles += (d.files || 1);
        totalChunks += (d.chunks || 0);
      } else {
        errors.push(`${file.name}: ${d.error || 'failed'}`);
      }
    } catch(e) {
      errors.push(`${file.name}: ${e.message}`);
    }
  }

  if (errors.length) {
    showIngestMsg(`${totalFiles} files, ${totalChunks} chunks. Errors: ${errors.join('; ')}`, errors.length === files.length ? 'err' : 'ok');
  } else {
    showIngestMsg(`${totalFiles} files, ${totalChunks} chunks`, 'ok');
  }
  input.value = '';
  btn.disabled = false;
  loadSources();
}

// Drag and drop on sidebar
(function() {
  const sb = document.getElementById('sidebar');
  let dragCounter = 0;
  sb.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; sb.classList.add('dragover'); });
  sb.addEventListener('dragleave', e => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { sb.classList.remove('dragover'); dragCounter = 0; } });
  sb.addEventListener('dragover', e => e.preventDefault());
  sb.addEventListener('drop', async e => {
    e.preventDefault(); sb.classList.remove('dragover'); dragCounter = 0;
    const files = e.dataTransfer.files;
    if (!files.length) return;
    showIngestMsg(`Uploading ${files.length} dropped file(s)...`, 'busy');
    let totalFiles = 0, totalChunks = 0;
    for (const file of files) {
      try {
        const body = new FormData();
        body.append('file', file);
        const r = await fetch(API + '/ingest', { method: 'POST', body });
        const d = await r.json();
        if (d.status === 'ok') { totalFiles += (d.files || 1); totalChunks += (d.chunks || 0); }
      } catch(e) {}
    }
    showIngestMsg(`${totalFiles} files, ${totalChunks} chunks`, 'ok');
    loadSources();
  });
})();

// Chat
function addMessage(role, content, sources, meta) {
  const welcome = document.querySelector('.welcome');
  if (welcome) welcome.remove();

  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  let html = '<div class="bubble">';
  html += renderMarkdown(content);

  if (sources && sources.length > 0) {
    html += '<div class="chat-sources"><details><summary>Sources (' + sources.length + ')</summary><ul>';
    for (const s of sources) {
      const label = s.file || 'unknown';
      const section = s.section ? ` \u2014 ${s.section}` : '';
      html += `<li><a href="#" onclick="event.preventDefault();selectSource('${escapeAttr(s.file)}')" style="color:var(--accent)">${escapeHtml(label)}</a>${escapeHtml(section)}</li>`;
    }
    html += '</ul></details></div>';
  }
  if (meta) {
    html += `<div class="meta">${escapeHtml(meta)}</div>`;
  }
  html += '</div>';
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function getAssistantBubble(msgDiv) {
  return msgDiv.querySelector('.bubble');
}

async function sendQuestion() {
  if (busy) return;
  const input = document.getElementById('question');
  const q = input.value.trim();
  if (!q) return;

  input.value = '';
  input.style.height = 'auto';
  busy = true;
  document.getElementById('send').disabled = true;

  addMessage('user', q);

  const assistantDiv = addMessage('assistant', '');
  const bubble = getAssistantBubble(assistantDiv);

  try {
    const body = new FormData();
    body.append('question', q);
    body.append('session_id', sessionId);
    body.append('stream', 'true');

    // Filter by active source if selected
    if (activeSource) {
      body.append('source_filter', activeSource);
    }

    const response = await fetch(API + '/chat', { method: 'POST', body });

    if (!response.ok) {
      const err = await response.text();
      bubble.innerHTML = `<span style="color:var(--error)">Error: ${escapeHtml(err)}</span>`;
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data:')) {
          const raw = line.slice(5).trim();
          if (!raw || raw === '[DONE]') continue;
          try {
            const parsed = JSON.parse(raw);
            fullText += parsed.token;
          } catch {
            fullText += raw;
          }
          bubble.innerHTML = renderMarkdown(fullText);
        }
      }
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    if (!fullText) {
      bubble.innerHTML = '<span style="color:var(--text-dim)">No response</span>';
    }

  } catch(e) {
    bubble.innerHTML = `<span style="color:var(--error)">Error: ${escapeHtml(e.message)}</span>`;
  } finally {
    busy = false;
    document.getElementById('send').disabled = false;
    input.focus();
  }
}

// Enter to send, Shift+Enter for newline
document.getElementById('question').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
});

// Auto-resize textarea
document.getElementById('question').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Simple markdown rendering
function renderMarkdown(text) {
  if (!text) return '';

  const codeBlocks = [];
  let s = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    codeBlocks.push(`<pre><code>${escapeHtml(code.trim())}</code></pre>`);
    return `\x00CB${codeBlocks.length - 1}\x00`;
  });

  const inlines = [];
  s = s.replace(/`([^`]+)`/g, (_, code) => {
    inlines.push(`<code>${escapeHtml(code)}</code>`);
    return `\x00IC${inlines.length - 1}\x00`;
  });

  s = escapeHtml(s);

  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');

  s = s.replace(/\n\n+/g, '</p><p>');
  s = s.replace(/\n/g, '<br>');
  s = '<p>' + s + '</p>';

  s = s.replace(/\x00CB(\d+)\x00/g, (_, i) => codeBlocks[i]);
  s = s.replace(/\x00IC(\d+)\x00/g, (_, i) => inlines[i]);

  return s;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

services:
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-agent-memory:
    image: redis/agent-memory-server:latest
    ports:
      - "9200:9200"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - MEMORY_SERVER_URL=http://redis-agent-memory:9200
    volumes:
      - ./docs:/app/docs
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:

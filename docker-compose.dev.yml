# Development overrides: hot reload, debug logging, no resource limits
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  app:
    build: .
    volumes:
      - ./src:/app/src
      - ./schemas:/app/schemas
      - ./docs:/app/docs
    environment:
      - LOG_LEVEL=debug
    command: ["uvicorn", "rtfm.api.routes:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src"]
    deploy:
      resources:
        limits:
          memory: 8G

  redis:
    ports:
      - "6379:6379"
      - "8001:8001"
    deploy:
      resources:
        limits:
          memory: 2G

  ollama:
    deploy:
      resources: {}

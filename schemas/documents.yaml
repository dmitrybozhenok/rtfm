index:
  name: rtfm-docs
  prefix: doc
  storage_type: hash

fields:
  - name: text
    type: text
  - name: source_file
    type: tag
  - name: source_url
    type: tag
  - name: source_type
    type: tag
  - name: section
    type: tag
  - name: chunk_index
    type: numeric
  - name: embedding
    type: vector
    attrs:
      algorithm: hnsw
      dims: 384
      distance_metric: cosine
      type: float32

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtfm"
version = "0.1.0"
description = "RTFM For Me — AI assistant that ingests docs and answers questions via RAG"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer[all]>=0.14.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "redisvl>=0.4.0",
    "sentence-transformers>=3.3.0",
    "einops>=0.8.0",
    "pymupdf4llm>=0.0.17",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.7.0",
]

[project.scripts]
rtfm = "rtfm.cli.app:app"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that load ML models or call LLMs (deselect with '-m \"not slow\"')",
    "integration: marks tests that require Redis or other services",
    "e2e: marks end-to-end browser tests requiring a running server",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rtfm"]
